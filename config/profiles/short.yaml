format: short
video:
  width: 1080
  height: 1920
  fps: 30
  max_shot_seconds: 3.2        # pattern interrupt: ningun plano dura mas
script:
  target_seconds: 70           # shorts de 1 minuto y poco
  min_words: 175
  max_words: 215
  structure: "hook -> context -> reveal 1 -> reveal 2 -> reveal 3 -> payoff -> loop_line"
  hook_candidates: 5
  loop: true
render:
  encoder: "auto"
  crf: 18
  bitrate: "10M"
  preset: "p5"
  crossfade: 0.16              # xfade sutil entre escenas (0 = corte seco)
metadata:
  title_max_chars: 60
  hashtags: ["#shorts", "#history", "#documentary"]
  description_template: |
    {summary}

    Part of The Hidden Thread — the hidden side of how the world works.
    {hashtags}
