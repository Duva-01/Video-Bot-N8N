name: Trigger Daily Video Workflow

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger n8n daily webhook
        env:
          N8N_DAILY_TRIGGER_URL: ${{ secrets.N8N_DAILY_TRIGGER_URL }}
        run: |
          if [ -z "$N8N_DAILY_TRIGGER_URL" ]; then
            echo "N8N_DAILY_TRIGGER_URL is not configured"
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST "$N8N_DAILY_TRIGGER_URL" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"github-actions\",\"trigger\":\"daily\",\"triggered_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}"
